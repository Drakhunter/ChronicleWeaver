<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="ringGold" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="45%" stop-color="#d4a85a"/>
      <stop offset="85%" stop-color="#734e19"/>
      <stop offset="100%" stop-color="#362104"/>
    </radialGradient>
    <radialGradient id="studGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#694008"/>
    </radialGradient>
  </defs>
  <!-- Outer Ornate Ring Shadow -->
  <circle cx="64" cy="65" r="60" fill="none" stroke="#000000" stroke-width="4" opacity="0.65"/>
  <!-- Outer Ring Bevel -->
  <circle cx="64" cy="64" r="59" fill="none" stroke="#4a2c07" stroke-width="2.5"/>
  <!-- Main Metallic Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#ringGold)" stroke-width="6"/>
  <!-- Inner Ring Accent -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#fff1b8" stroke-width="1.2" opacity="0.8"/>
  <circle cx="64" cy="64" r="49" fill="none" stroke="#2b1702" stroke-width="2"/>

  <!-- Ornate Cardinal Gem Studs (12, 3, 6, 9 o'clock) -->
  <circle cx="64" cy="8" r="4.5" fill="url(#studGold)" stroke="#2b1702" stroke-width="1"/>
  <circle cx="64" cy="120" r="4.5" fill="url(#studGold)" stroke="#2b1702" stroke-width="1"/>
  <circle cx="8" cy="64" r="4.5" fill="url(#studGold)" stroke="#2b1702" stroke-width="1"/>
  <circle cx="120" cy="64" r="4.5" fill="url(#studGold)" stroke="#2b1702" stroke-width="1"/>

  <!-- Diagonal Mini Studs (1:30, 4:30, 7:30, 10:30) -->
  <circle cx="24.4" cy="24.4" r="3" fill="url(#studGold)" stroke="#2b1702" stroke-width="0.8"/>
  <circle cx="103.6" cy="24.4" r="3" fill="url(#studGold)" stroke="#2b1702" stroke-width="0.8"/>
  <circle cx="103.6" cy="103.6" r="3" fill="url(#studGold)" stroke="#2b1702" stroke-width="0.8"/>
  <circle cx="24.4" cy="103.6" r="3" fill="url(#studGold)" stroke="#2b1702" stroke-width="0.8"/>
</svg>
